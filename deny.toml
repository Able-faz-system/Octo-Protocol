# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[advisories]
version = 2
yanked = "deny"
# cargo-deny resolves a narrower graph than cargo-audit, so it only needs the two advisories that
# actually match here; the lockfile-only ones live in .cargo/audit.toml. Listing an unmatched id
# here would be reported as "no crate matched advisory criteria".
# Re-check on every dependency bump — an exception that gains a reverse-dependency path stops
# being an exception and becomes a real finding.
#
# Re-checked for the evm-core / evm-rpc dependency surface (#217, #218): the secp256k1/BIP-32
# stack (k256, elliptic-curve, bip32, sha2, hmac, zeroize), sha3/keccak, alloy-primitives, and the
# evm-rpc client (reqwest/rustls, serde_json) do not introduce a reverse-dependency path to either
# ignored advisory below. Both exceptions remain scoped to their original crates.
ignore = [
    # Reachable via stellar-base, but unmaintained-only with no safe upgrade published. Tracked as
    # a dependency-replacement task rather than silently accepted forever.
    "RUSTSEC-2022-0081",
    # Unsoundness in a path we do not exercise: we never call Error::downcast_mut.
    "RUSTSEC-2026-0190",
]

[licenses]
version = 2
# Allow the permissive licenses common across our dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # webpki-roots ships Mozilla's CA bundle; the data itself carries this permissive licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"